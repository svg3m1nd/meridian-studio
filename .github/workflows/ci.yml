name: Meridian CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: meridian-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 04_app
    env:
      DATABASE_URL: postgresql://runtime:ci-only@127.0.0.1:5432/meridian_ci
      DIRECT_URL: postgresql://migrate:ci-only@127.0.0.1:5432/meridian_ci
      APP_BASE_URL: http://localhost:3000
      AUTH_SECRET: ci-only-secret-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: 04_app/package-lock.json
      - run: npm ci
      - run: npm run db:validate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
